function computeStats(user, ideas, userVotes, events=[]) {
  const myIdeas = ideas.filter(i => i.author === user.name);
  const totalLikes = myIdeas.reduce((s,i) => s+i.likes, 0);
  const maxIdeaLikes = myIdeas.length > 0 ? Math.max(...myIdeas.map(i=>i.likes)) : 0;
  const votes = Object.values(userVotes).filter(Boolean).length;
  const comments = ideas.reduce((s,i) => s + i.comments.filter(c=>c.user===user.name).length, 0);
  const solutions = ideas.reduce((s,i) => s + i.solutions.filter(sol=>sol.user===user.name).length, 0);
  const eventsJoined = events.filter(e=>e.registrations.includes(user.name)).length;
  const eventsWon = events.filter(e=>e.announced&&e.winners.length>0&&myIdeas.some(mi=>e.winners.includes(mi.id))).length;
  const hasEarlyIdea = myIdeas.some(i=>i.id<=4);
  return { ideas:myIdeas.length, totalLikes, maxIdeaLikes, votes, comments, solutions, eventsJoined, eventsWon, hasEarlyIdea };
}

}

        {schedOpen&&<div style={{padding:16,background:"#FFFDE7",borderRadius:12,border:`1px solid ${COLORS.gold}`}}>{schedMsg?<div style={{color:COLORS.green,fontWeight:600,fontSize:13}}>{schedMsg}</div>:<div style={{display:"flex",gap:8}}><input type="datetime-local" value={schedDate} onChange={e=>setSchedDate(e.target.value)} style={{flex:1,padding:"8px 12px",borderRadius:8,border:`1px solid ${COLORS.border}`,fontSize:13}}/><button onClick={()=>{if(schedDate){setSchedMsg(`✅ Scheduled for ${new Date(schedDate).toLocaleString()}!`);setTimeout(()=>setSchedOpen(false),2500)}}} style={{padding:"8px 18px",borderRadius:8,background:COLORS.gold,border:"none",color:"#fff",fontWeight:700,cursor:"pointer",fontSize:13}}>Confirm</button></div>}</div>}

        <div><textarea value={solution} onChange={e=>setSolution(e.target.value)} placeholder="Describe your proposed solution..." style={{width:"100%",padding:"12px 14px",borderRadius:10,border:`1px solid ${COLORS.border}`,fontSize:13,resize:"vertical",minHeight:80,boxSizing:"border-box",fontFamily:"inherit"}}/><button onClick={()=>{if(solution.trim()){onAddSolution(idea.id,solution);setSolution("")}}} style={{marginTop:8,padding:"10px 22px",borderRadius:10,background:COLORS.green,border:"none",color:"#fff",fontWeight:700,cursor:"pointer",fontSize:13}}>🚀 Publish Solution</button></div>
      </div>}
      {tab==="comments"&&<div style={{display:"flex",flexDirection:"column",gap:14}}>
        {idea.comments.map(c=><div key={c.id} style={{display:"flex",gap:10}}><Av letter={c.avatar} color={c.color} size={34}/><div style={{flex:1}}><div style={{display:"flex",gap:8,marginBottom:4}}><span style={{fontSize:13,fontWeight:700,color:COLORS.navy}}>{c.user}</span><span style={{fontSize:11,color:COLORS.muted}}>{c.time}</span></div><div style={{padding:"10px 14px",background:COLORS.lightBg,borderRadius:"0 12px 12px 12px",fontSize:13,color:"#334455",lineHeight:1.6}}>{c.text}</div></div></div>)}
        <div style={{display:"flex",gap:10,marginTop:6}}><Av letter={currentUser.avatar} color={currentUser.avatarColor} size={34}/><input value={comment} onChange={e=>setComment(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&comment.trim()){onAddComment(idea.id,comment,currentUser);setComment("")}}} placeholder="Add a comment… (Enter to post)" style={{flex:1,padding:"10px 14px",borderRadius:10,border:`1px solid ${COLORS.border}`,fontSize:13,fontFamily:"inherit"}}/><button onClick={()=>{if(comment.trim()){onAddComment(idea.id,comment,currentUser);setComment("")}}} style={{padding:"10px 18px",borderRadius:10,background:COLORS.accent,border:"none",color:"#fff",fontWeight:700,cursor:"pointer",fontSize:13}}>Post</button></div>
      </div>}
      {tab==="ai"&&<div style={{display:"flex",flexDirection:"column",gap:16}}>
        <div style={{padding:"16px 20px",background:"linear-gradient(135deg,#E3F2FD,#EDE7F6)",borderRadius:14,border:"1px solid #B3C9F0"}}><div style={{fontSize:14,fontWeight:700,color:COLORS.primary,marginBottom:6}}>🤖 AI Innovation Advisor</div><div style={{fontSize:13,color:"#445566",lineHeight:1.6}}>Get an AI-powered impact assessment, next steps, and risk analysis.</div></div>
        <button onClick={fetchAI} disabled={aiLoading} style={{padding:"12px 24px",borderRadius:12,background:aiLoading?COLORS.muted:COLORS.accent,border:"none",color:"#fff",fontWeight:700,cursor:aiLoading?"default":"pointer",fontSize:14}}>{aiLoading?"⏳ Analysing…":"✨ Get AI Assessment"}</button>
        {aiText&&<div style={{padding:"18px 20px",background:"#fff",borderRadius:14,border:`1px solid ${COLORS.border}`}}><div style={{fontSize:12,fontWeight:700,color:COLORS.accent,textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>AI Assessment</div><div style={{fontSize:13,color:"#334455",lineHeight:1.75,whiteSpace:"pre-wrap"}}>{aiText}</div></div>}
      </div>}
    </div>
  </div></div>
}

function SubmitModal({onClose,onSubmit,currentUser}){

    <div style={{background:COLORS.primary,padding:"22px 28px",color:"#fff",display:"flex",justifyContent:"space-between",alignItems:"center"}}><div style={{display:"flex",alignItems:"center",gap:12}}><Av letter={currentUser.avatar} color={currentUser.avatarColor} size={36}/><div><div style={{fontSize:16,fontWeight:700}}>💡 Submit New Idea</div><div style={{fontSize:12,color:"rgba(255,255,255,0.65)",marginTop:1}}>as {currentUser.name}</div></div></div><button onClick={onClose} style={{background:"rgba(255,255,255,0.15)",border:"none",borderRadius:8,color:"#fff",cursor:"pointer",fontSize:18,padding:"2px 10px"}}>✕</button></div>

      <div><div style={{fontSize:12,fontWeight:700,color:COLORS.navy,marginBottom:6}}>Category *</div><div style={{display:"flex",gap:10}}>{["Business","Technical"].map(c=><button key={c} onClick={()=>set("category",c)} style={{flex:1,padding:"10px",borderRadius:10,border:`2px solid ${form.category===c?COLORS.accent:COLORS.border}`,background:form.category===c?"#E3F2FD":"#fff",color:form.category===c?COLORS.accent:COLORS.muted,fontWeight:700,cursor:"pointer",fontSize:13}}>{c==="Business"?"💼 Business":"⚙️ Technical"}</button>)}</div></div>
      {[{label:"Detailed Description *",key:"detailDesc",placeholder:"Background, problem being solved, proposed approach..."},{label:"Example & Impact",key:"example",placeholder:"Describe a real scenario where this helps someone..."},{label:"Tags (comma-separated)",key:"tags",placeholder:"e.g. AI, Automation, Cost Savings"}].map(({label,key,placeholder})=><div key={key}><div style={{fontSize:12,fontWeight:700,color:COLORS.navy,marginBottom:6}}>{label}</div><textarea value={form[key]} onChange={e=>set(key,e.target.value)} placeholder={placeholder} style={{width:"100%",padding:"10px 14px",borderRadius:10,border:`1px solid ${COLORS.border}`,fontSize:13,resize:"vertical",minHeight:80,boxSizing:"border-box",fontFamily:"inherit"}}/></div>)}

    <div style={{background:"linear-gradient(135deg,#1A3A5C 0%,#0D47A1 100%)",padding:"24px 28px 0",color:"#fff"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",gap:16}}>

        <button onClick={onClose} style={{background:"rgba(255,255,255,0.15)",border:"none",borderRadius:8,color:"#fff",cursor:"pointer",fontSize:18,padding:"3px 11px"}}>✕</button>
      </div>
      <div style={{display:"flex",gap:2,overflowX:"auto"}}>{tabs.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{padding:"10px 14px",border:"none",background:"none",color:tab===t.id?"#fff":"rgba(255,255,255,0.55)",fontWeight:tab===t.id?700:500,fontSize:12,borderBottom:tab===t.id?"2.5px solid #fff":"2.5px solid transparent",cursor:"pointer",whiteSpace:"nowrap"}}>{t.label}</button>)}</div>

        <div><div style={{fontSize:12,fontWeight:700,color:COLORS.navy,marginBottom:10}}>Innovation Interests</div><div style={{display:"flex",flexWrap:"wrap",gap:8}}>{INTEREST_OPTIONS.map(interest=>{const active=(form.interests||[]).includes(interest);return<button key={interest} onClick={()=>toggleInt(interest)} style={{padding:"6px 14px",borderRadius:20,border:`1.5px solid ${active?COLORS.accent:COLORS.border}`,background:active?"#E3F2FD":"#fff",color:active?COLORS.accent:COLORS.muted,fontSize:12,fontWeight:active?700:500,cursor:"pointer"}}>{active?"✓ ":""}{interest}</button>})}</div></div>

          </div>
          <div style={{marginTop:14}}>
            <div style={{fontSize:11,color:"#8D6E00",marginBottom:6,fontWeight:600}}>Your progress → {stats.ideas} idea{stats.ideas!==1?"s":""} · {stats.totalLikes} likes received</div>

            <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#8D6E00",marginTop:4}}><span>Bronze</span><span>Silver</span><span>Gold</span></div>

        })()}
      </div>}

      {tab==="activity"&&<div style={{display:"flex",flexDirection:"column",gap:20}}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}}>{[{label:"Ideas",value:stats.ideas,color:COLORS.accent,icon:"💡"},{label:"Likes Rcvd",value:stats.totalLikes,color:COLORS.green,icon:"👍"},{label:"Votes Cast",value:stats.votes,color:COLORS.purple,icon:"🗳️"},{label:"Comments",value:stats.comments,color:COLORS.gold,icon:"💬"}].map(({label,value,color,icon})=><div key={label} style={{background:"#fff",border:`1px solid ${COLORS.border}`,borderRadius:14,padding:"16px 14px",textAlign:"center"}}><div style={{fontSize:22}}>{icon}</div><div style={{fontSize:26,fontWeight:800,color,marginTop:4}}>{value}</div><div style={{fontSize:11,color:COLORS.muted,fontWeight:600,marginTop:2}}>{label}</div></div>)}</div>

        <div style={{padding:"16px 18px",background:COLORS.lightBg,borderRadius:14,border:`1px solid ${COLORS.border}`}}>
          <div style={{fontSize:12,fontWeight:700,color:COLORS.navy,marginBottom:10}}>🏆 Contribution Level</div>
          {(()=>{const score=stats.ideas*10+stats.totalLikes+stats.votes*2+stats.comments;const level=score<20?"Explorer":score<60?"Contributor":score<150?"Innovator":"Champion";const pct=Math.min(100,Math.round((score/200)*100));const lc=score<20?COLORS.muted:score<60?COLORS.accent:score<150?COLORS.purple:COLORS.gold;return<><div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><span style={{fontSize:14,fontWeight:700,color:lc}}>🎖️ {level}</span><span style={{fontSize:12,color:COLORS.muted}}>{score} pts</span></div><div style={{height:8,borderRadius:4,background:"#D0E4F0"}}><div style={{height:"100%",width:`${pct}%`,background:lc,borderRadius:4,transition:"width 0.6s"}}/></div><div style={{fontSize:11,color:COLORS.muted,marginTop:6}}>Submit and vote to level up!</div></>})()}
        </div>
      </div>}
      {tab==="notifications"&&<div style={{display:"flex",flexDirection:"column",gap:8}}>{[{key:"email",label:"Email Notifications",desc:"Get emailed when someone comments or votes on your ideas.",icon:"📧"},{key:"inApp",label:"In-App Notifications",desc:"See a badge in the portal for new activity.",icon:"🔔"},{key:"digest",label:"Weekly Digest",desc:"A weekly summary of top ideas every Monday.",icon:"📋"}].map(({key,label,desc,icon})=><div key={key} style={{display:"flex",alignItems:"center",gap:14,padding:"16px 18px",background:COLORS.lightBg,borderRadius:12,border:`1px solid ${COLORS.border}`,marginBottom:8}}><span style={{fontSize:22}}>{icon}</span><div style={{flex:1}}><div style={{fontSize:13,fontWeight:700,color:COLORS.navy}}>{label}</div><div style={{fontSize:12,color:COLORS.muted,marginTop:2}}>{desc}</div></div><Tog checked={form.notifications[key]} onChange={v=>setN("notifications",key,v)}/></div>)}</div>}
      {tab==="privacy"&&<div style={{display:"flex",flexDirection:"column",gap:8}}>{[{key:"showEmail",label:"Show Email Address",desc:"Let others see your email on your profile.",icon:"📧"},{key:"showVotes",label:"Show Voting Activity",desc:"Let others see which ideas you've voted on.",icon:"🗳️"},{key:"showActivity",label:"Show Activity Feed",desc:"Let others see your comments and submissions.",icon:"📊"}].map(({key,label,desc,icon})=><div key={key} style={{display:"flex",alignItems:"center",gap:14,padding:"16px 18px",background:COLORS.lightBg,borderRadius:12,border:`1px solid ${COLORS.border}`,marginBottom:8}}><span style={{fontSize:22}}>{icon}</span><div style={{flex:1}}><div style={{fontSize:13,fontWeight:700,color:COLORS.navy}}>{label}</div><div style={{fontSize:12,color:COLORS.muted,marginTop:2}}>{desc}</div></div><Tog checked={form.privacy[key]} onChange={v=>setN("privacy",key,v)}/></div>)}</div>}
      {tab==="appearance"&&<div style={{display:"flex",flexDirection:"column",gap:20}}><div><div style={{fontSize:13,fontWeight:700,color:COLORS.navy,marginBottom:12}}>Theme</div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>{[{value:"light",label:"☀️ Light",desc:"Clean and bright.",preview:["#F0F6FF","#FFFFFF","#1A3A5C"]},{value:"dark",label:"🌙 Dark",desc:"Easy on the eyes.",preview:["#0F1B2D","#1A2B40","#2196F3"]}].map(({value,label,desc,preview})=><div key={value} onClick={()=>set("theme",value)} style={{padding:"16px",borderRadius:14,border:`2px solid ${form.theme===value?COLORS.accent:COLORS.border}`,cursor:"pointer",background:form.theme===value?"#E3F2FD":"#fff"}}><div style={{display:"flex",gap:6,marginBottom:10}}>{preview.map((c,i)=><div key={i} style={{flex:1,height:24,borderRadius:4,background:c}}/>)}</div><div style={{fontSize:13,fontWeight:700,color:COLORS.navy}}>{label}</div><div style={{fontSize:12,color:COLORS.muted,marginTop:3}}>{desc}</div>{form.theme===value&&<div style={{fontSize:11,color:COLORS.accent,fontWeight:700,marginTop:6}}>✓ Active</div>}</div>)}</div></div></div>}
    </div>
    <div style={{padding:"16px 28px",borderTop:`1px solid ${COLORS.border}`,display:"flex",justifyContent:"space-between",alignItems:"center",background:"#FAFBFD"}}><div style={{fontSize:12,color:saved?COLORS.green:"transparent",fontWeight:600}}>✅ Changes saved!</div><div style={{display:"flex",gap:10}}><button onClick={onClose} style={{padding:"10px 22px",borderRadius:10,border:`1.5px solid ${COLORS.border}`,background:"#fff",color:COLORS.muted,fontWeight:600,cursor:"pointer",fontSize:13}}>Cancel</button><button onClick={handleSave} style={{padding:"10px 28px",borderRadius:10,background:COLORS.accent,border:"none",color:"#fff",fontWeight:700,cursor:"pointer",fontSize:13}}>Save Changes</button></div></div>
  </div></div>
}

function EventCard({event,ideas,onClick}){
  const es=evStyle[event.status];
  const topId=event.submissions.length>0?event.submissions.reduce((b,s)=>(event.eventVotes[s]||0)>(event.eventVotes[b]||0)?s:b,event.submissions[0]):null;
  const topIdea=topId?ideas.find(i=>i.id===topId):null;
  const daysLeft=event.status==="active"?Math.max(0,Math.ceil((new Date(event.endDate)-new Date())/(864e5))):null;
  return <div onClick={()=>onClick(event)} style={{background:"#fff",border:`1px solid ${COLORS.border}`,borderRadius:18,overflow:"hidden",cursor:"pointer",transition:"box-shadow 0.18s,transform 0.18s",boxShadow:"0 2px 14px rgba(15,27,45,0.07)"}} onMouseEnter={e=>{e.currentTarget.style.boxShadow="0 10px 32px rgba(33,150,243,0.14)";e.currentTarget.style.transform="translateY(-2px)"}} onMouseLeave={e=>{e.currentTarget.style.boxShadow="0 2px 14px rgba(15,27,45,0.07)";e.currentTarget.style.transform="translateY(0)"}}>
    <div style={{background:`linear-gradient(135deg,${COLORS.primary},#0D47A1)`,padding:"20px 22px",color:"#fff",position:"relative"}}>
      <div style={{fontSize:36,marginBottom:8}}>{event.banner}</div>
      <div style={{fontSize:17,fontWeight:800,lineHeight:1.3,marginBottom:4}}>{event.title}</div>
      <div style={{fontSize:12,color:"rgba(255,255,255,0.7)"}}>Theme: {event.theme}</div>
      <div style={{position:"absolute",top:16,right:16}}><span style={{fontSize:11,fontWeight:700,padding:"4px 12px",borderRadius:20,background:es.bg,color:es.text}}>{es.label}</span></div>
      {daysLeft!==null&&<div style={{position:"absolute",bottom:16,right:16,textAlign:"right"}}><div style={{fontSize:22,fontWeight:800}}>{daysLeft}</div><div style={{fontSize:10,color:"rgba(255,255,255,0.7)"}}>days left</div></div>}
    </div>
    <div style={{padding:"16px 22px",display:"flex",flexDirection:"column",gap:12}}>
      <div style={{fontSize:13,color:"#445566",lineHeight:1.6}}>{event.description.slice(0,100)}…</div>
      <div style={{display:"flex",gap:20}}>
        <div style={{textAlign:"center"}}><div style={{fontSize:20,fontWeight:800,color:COLORS.accent}}>{event.submissions.length}</div><div style={{fontSize:10,color:COLORS.muted,fontWeight:600}}>IDEAS</div></div>
        <div style={{textAlign:"center"}}><div style={{fontSize:20,fontWeight:800,color:COLORS.green}}>{event.registrations.length}</div><div style={{fontSize:10,color:COLORS.muted,fontWeight:600}}>REGISTERED</div></div>
        <div style={{textAlign:"center"}}><div style={{fontSize:20,fontWeight:800,color:COLORS.gold}}>{Object.values(event.eventVotes).reduce((s,v)=>s+v,0)}</div><div style={{fontSize:10,color:COLORS.muted,fontWeight:600}}>VOTES</div></div>
      </div>
      {event.announced&&event.winners.length>0&&<div style={{padding:"10px 14px",background:"linear-gradient(135deg,#FFF8E1,#FFFDE7)",borderRadius:10,border:`1px solid ${COLORS.gold}`,fontSize:12}}><span style={{fontWeight:700,color:"#B8860B"}}>🏆 Winners announced!</span></div>}
      {topIdea&&!event.announced&&<div style={{padding:"10px 14px",background:COLORS.lightBg,borderRadius:10,border:`1px solid ${COLORS.border}`,fontSize:12,color:COLORS.muted}}>🔥 Leading: <strong style={{color:COLORS.navy}}>{topIdea.title}</strong></div>}
      <div style={{fontSize:11,color:COLORS.muted}}>🎁 {event.prize}</div>
    </div>
  </div>
}

function EventDetail({event,ideas,currentUser,onClose,onVoteIdea,onSubmitToEvent,onAnnounceWinners}){
  const [tab,setTab]=useState("detail");
  const [evVoted,setEvVoted]=useState({});
  const [winnerPicks,setWinnerPicks]=useState(event.winners||[]);
  const [announced,setAnnounced]=useState(event.announced||false);
  const [aiLoading,setAiLoading]=useState(false),[aiRecs,setAiRecs]=useState("");
  const [localEvent,setLocalEvent]=useState(event);

  const submitted=localEvent.submissions.map(sid=>ideas.find(i=>i.id===sid)).filter(Boolean);
  const ranked=[...submitted].sort((a,b)=>(localEvent.eventVotes[b.id]||0)-(localEvent.eventVotes[a.id]||0));
  const totalVotes=Object.values(localEvent.eventVotes).reduce((s,v)=>s+v,0);
  const es=evStyle[localEvent.status];
  const isReg=localEvent.registrations.includes(currentUser.name);
  const tabs=localEvent.status==="completed"||announced
    ?[["detail","📋 Event"],["leaderboard","🏅 Leaderboard"],["winners","🏆 Winners"],["ai","🤖 AI Judge"]]
    :[["detail","📋 Event"],["ideas","💡 Ideas"],["leaderboard","🏅 Leaderboard"],["ai","🤖 AI Judge"]];

  const handleEvVote=(ideaId)=>{
    if(evVoted[ideaId])return;
    setEvVoted(m=>({...m,[ideaId]:true}));
    setLocalEvent(e=>({...e,eventVotes:{...e.eventVotes,[ideaId]:(e.eventVotes[ideaId]||0)+1}}));
    onVoteIdea(localEvent.id,ideaId);
  };
  const fetchAI=async()=>{
    setAiLoading(true);setAiRecs("");
    const lines=ranked.slice(0,5).map((idea,i)=>`${i+1}. ${idea.title} (${localEvent.eventVotes[idea.id]||0} event votes)`).join("\n");
    try{const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:800,messages:[{role:"user",content:`You are an innovation judge for "${localEvent.title}" (Theme: ${localEvent.theme}).\n\nTop ideas:\n${lines}\n\nProvide: 1) Top 3 recommended winners with brief justification 2) One honorable mention 3) Key criteria that made top ideas stand out. Be concise and decisive.`}]})});
    const d=await r.json();setAiRecs(d.content?.[0]?.text||"Could not load.");}catch{setAiRecs("Unable to connect. Try again.");}setAiLoading(false);
  };
  const handleAnnounce=()=>{onAnnounceWinners(localEvent.id,winnerPicks);setAnnounced(true);setLocalEvent(e=>({...e,winners:winnerPicks,announced:true,status:"completed"}));setTab("winners")};

  return <div style={{position:"fixed",inset:0,background:"rgba(15,27,45,0.6)",zIndex:1500,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={onClose}><div style={{background:"#fff",borderRadius:22,width:"100%",maxWidth:820,maxHeight:"92vh",overflow:"hidden",display:"flex",flexDirection:"column",boxShadow:"0 32px 80px rgba(15,27,45,0.3)"}} onClick={e=>e.stopPropagation()}>
    <div style={{background:`linear-gradient(135deg,${COLORS.primary},#0D47A1)`,padding:"24px 28px 0",color:"#fff"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",gap:14}}><div style={{fontSize:40}}>{localEvent.banner}</div><div><div style={{fontSize:20,fontWeight:800,lineHeight:1.2}}>{localEvent.title}</div><div style={{fontSize:13,color:"rgba(255,255,255,0.7)",marginTop:3}}>Theme: {localEvent.theme} · By {localEvent.organizer}</div><div style={{marginTop:8}}><span style={{fontSize:11,fontWeight:700,padding:"4px 12px",borderRadius:20,background:es.bg,color:es.text}}>{es.label}</span></div></div></div>
        <button onClick={onClose} style={{background:"rgba(255,255,255,0.15)",border:"none",borderRadius:8,color:"#fff",cursor:"pointer",fontSize:18,padding:"3px 11px"}}>✕</button>
      </div>
      <div style={{display:"flex",gap:2,overflowX:"auto"}}>{tabs.map(([t,l])=><button key={t} onClick={()=>setTab(t)} style={{padding:"10px 18px",border:"none",background:"none",color:tab===t?"#fff":"rgba(255,255,255,0.55)",fontWeight:tab===t?700:500,fontSize:13,borderBottom:tab===t?"2.5px solid #fff":"2.5px solid transparent",cursor:"pointer",whiteSpace:"nowrap"}}>{l}</button>)}</div>
    </div>
    <div style={{flex:1,overflowY:"auto",padding:"24px 28px"}}>
      {tab==="detail"&&<div style={{display:"flex",flexDirection:"column",gap:18}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>{[{label:"Submissions",value:localEvent.submissions.length,icon:"💡",color:COLORS.accent},{label:"Registered",value:localEvent.registrations.length,icon:"👥",color:COLORS.green},{label:"Total Votes",value:totalVotes,icon:"🗳️",color:COLORS.purple}].map(({label,value,icon,color})=><div key={label} style={{background:COLORS.lightBg,borderRadius:14,padding:"16px",textAlign:"center",border:`1px solid ${COLORS.border}`}}><div style={{fontSize:26}}>{icon}</div><div style={{fontSize:24,fontWeight:800,color,marginTop:4}}>{value}</div><div style={{fontSize:11,color:COLORS.muted,fontWeight:600,marginTop:2}}>{label}</div></div>)}</div>
        <div style={{padding:"16px 20px",background:COLORS.lightBg,borderRadius:14,border:`1px solid ${COLORS.border}`}}><div style={{fontSize:13,fontWeight:700,color:COLORS.navy,marginBottom:8}}>📋 About this event</div><div style={{fontSize:13,color:"#445566",lineHeight:1.7,marginBottom:12}}>{localEvent.description}</div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,fontSize:12}}>{[{label:"📅 Start",value:localEvent.startDate},{label:"🏁 End",value:localEvent.endDate},{label:"🗳️ Voting Deadline",value:localEvent.votingDeadline},{label:"🎁 Prize",value:localEvent.prize}].map(({label,value})=><div key={label} style={{padding:"10px 14px",background:"#fff",borderRadius:10,border:`1px solid ${COLORS.border}`}}><div style={{color:COLORS.muted,marginBottom:2}}>{label}</div><div style={{fontWeight:700,color:COLORS.navy}}>{value}</div></div>)}</div></div>
        {!isReg&&localEvent.status==="active"&&<button onClick={()=>{onSubmitToEvent("register",localEvent.id,currentUser.name);setLocalEvent(e=>({...e,registrations:[...e.registrations,currentUser.name]}))}} style={{padding:"13px",borderRadius:12,background:COLORS.accent,border:"none",color:"#fff",fontWeight:700,cursor:"pointer",fontSize:14}}>✅ Register for this Event</button>}
        {isReg&&<div style={{padding:"12px 18px",background:"#E8F5E9",borderRadius:12,border:"1px solid #A5D6A7",fontSize:13,fontWeight:600,color:COLORS.green}}>✅ You're registered!</div>}
        {localEvent.status==="active"&&isReg&&<div style={{padding:"14px 18px",background:"#FFF8E1",borderRadius:12,border:`1px solid ${COLORS.gold}`}}>
          <div style={{fontSize:13,fontWeight:700,color:"#7D5A00",marginBottom:8}}>📤 Submit an idea to this event</div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {ideas.filter(i=>!localEvent.submissions.includes(i.id)&&localEvent.eligibleCategories.includes(i.category)).map(idea=><div key={idea.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:"#fff",borderRadius:10,border:`1px solid ${COLORS.border}`}}><div style={{flex:1,fontSize:13,fontWeight:600,color:COLORS.navy}}>{idea.title}</div><Pill color={catColors[idea.category].text} bg={catColors[idea.category].bg}>{idea.category}</Pill><button onClick={()=>{onSubmitToEvent("add",localEvent.id,idea.id);setLocalEvent(e=>({...e,submissions:[...e.submissions,idea.id],eventVotes:{...e.eventVotes,[idea.id]:0}}))}} style={{padding:"6px 14px",borderRadius:8,background:COLORS.accent,border:"none",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer"}}>Add →</button></div>)}
            {ideas.filter(i=>!localEvent.submissions.includes(i.id)&&localEvent.eligibleCategories.includes(i.category)).length===0&&<div style={{fontSize:13,color:COLORS.muted,textAlign:"center",padding:"8px 0"}}>All eligible ideas are already submitted.</div>}
          </div>
        </div>}
      </div>}

      {tab==="ideas"&&<div style={{display:"flex",flexDirection:"column",gap:14}}>
        {submitted.length===0&&<div style={{color:COLORS.muted,textAlign:"center",padding:"32px 0",fontSize:14}}>No ideas submitted yet.</div>}
        {submitted.map(idea=>{
          const evVotes=localEvent.eventVotes[idea.id]||0,evPct=totalVotes>0?Math.round((evVotes/totalVotes)*100):0,hasVoted=evVoted[idea.id];
          return <div key={idea.id} style={{background:"#fff",border:`1px solid ${COLORS.border}`,borderRadius:14,padding:"16px 20px",display:"flex",flexDirection:"column",gap:10}}>
            <div style={{display:"flex",alignItems:"flex-start",gap:10}}><Av letter={idea.avatar} color={idea.avatarColor} size={36}/><div style={{flex:1}}><div style={{fontSize:15,fontWeight:700,color:COLORS.navy,marginBottom:3}}>{idea.title}</div><div style={{fontSize:12,color:"#445566",lineHeight:1.5}}>{idea.shortDesc}</div></div><div style={{textAlign:"right",flexShrink:0}}><div style={{fontSize:22,fontWeight:800,color:COLORS.purple}}>{evVotes}</div><div style={{fontSize:10,color:COLORS.muted}}>event votes</div></div></div>
            <div style={{display:"flex",alignItems:"center",gap:10}}><div style={{flex:1,height:6,borderRadius:3,background:"#E0E8F0",overflow:"hidden"}}><div style={{height:"100%",width:`${evPct}%`,background:COLORS.purple,borderRadius:3,transition:"width 0.4s"}}/></div><span style={{fontSize:11,color:COLORS.muted,minWidth:32}}>{evPct}%</span>{localEvent.status==="voting"&&<button onClick={()=>handleEvVote(idea.id)} disabled={hasVoted} style={{padding:"7px 18px",borderRadius:20,background:hasVoted?"#E8F5E9":COLORS.accent,border:`1.5px solid ${hasVoted?COLORS.green:COLORS.accent}`,color:hasVoted?COLORS.green:"#fff",fontSize:12,fontWeight:700,cursor:hasVoted?"default":"pointer"}}>{hasVoted?"✓ Voted":"🗳️ Vote"}</button>}</div>
          </div>;
        })}
      </div>}

      {tab==="leaderboard"&&<div style={{display:"flex",flexDirection:"column",gap:12}}>
        <div style={{fontSize:13,color:COLORS.muted,marginBottom:4}}>Ranked by event votes.</div>
        {ranked.map((idea,index)=>{
          const evVotes=localEvent.eventVotes[idea.id]||0,evPct=totalVotes>0?Math.round((evVotes/totalVotes)*100):0;
          const isWin=(localEvent.winners.length>0?localEvent.winners:winnerPicks).includes(idea.id);
          const medal=index===0?"🥇":index===1?"🥈":index===2?"🥉":"";
          return <div key={idea.id} style={{background:isWin?"linear-gradient(135deg,#FFF8E1,#FFFDE7)":"#fff",border:`1.5px solid ${isWin?COLORS.gold:COLORS.border}`,borderRadius:14,padding:"16px 20px",display:"flex",alignItems:"center",gap:14}}>
            <div style={{fontSize:28,minWidth:40,textAlign:"center"}}>{medal||`#${index+1}`}</div><Av letter={idea.avatar} color={idea.avatarColor} size={40}/>
            <div style={{flex:1}}><div style={{fontSize:14,fontWeight:700,color:COLORS.navy}}>{idea.title}</div><div style={{fontSize:12,color:COLORS.muted,marginTop:2}}>{idea.author} · {idea.category}</div><div style={{marginTop:6,height:5,borderRadius:3,background:"#E0E8F0",overflow:"hidden"}}><div style={{height:"100%",width:`${evPct}%`,background:isWin?COLORS.gold:COLORS.purple,borderRadius:3}}/></div></div>
            <div style={{textAlign:"right"}}><div style={{fontSize:24,fontWeight:800,color:isWin?COLORS.gold:COLORS.purple}}>{evVotes}</div><div style={{fontSize:10,color:COLORS.muted}}>votes · {evPct}%</div>{isWin&&<div style={{fontSize:11,fontWeight:700,color:COLORS.gold,marginTop:4}}>🏆 Winner</div>}</div>
          </div>;
        })}
        {!announced&&ranked.length>=1&&<div style={{marginTop:8,padding:"16px 20px",background:COLORS.lightBg,borderRadius:14,border:`1px solid ${COLORS.border}`}}>
          <div style={{fontSize:13,fontWeight:700,color:COLORS.navy,marginBottom:10}}>🏆 Select & Announce Winners</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:12}}>{ranked.map(idea=>{const picked=winnerPicks.includes(idea.id);return <button key={idea.id} onClick={()=>setWinnerPicks(p=>picked?p.filter(x=>x!==idea.id):[...p,idea.id])} style={{padding:"7px 14px",borderRadius:20,border:`2px solid ${picked?COLORS.gold:COLORS.border}`,background:picked?"#FFF8E1":"#fff",color:picked?"#7D5A00":COLORS.muted,fontWeight:picked?700:500,cursor:"pointer",fontSize:12}}>{picked?"★ ":""}{idea.title.slice(0,28)}{idea.title.length>28?"…":""}</button>})}</div>
          <button onClick={handleAnnounce} disabled={winnerPicks.length===0} style={{padding:"11px 28px",borderRadius:12,background:winnerPicks.length>0?COLORS.gold:COLORS.border,border:"none",color:"#fff",fontWeight:700,cursor:winnerPicks.length>0?"pointer":"default",fontSize:14}}>🎉 Announce Winners ({winnerPicks.length} selected)</button>
        </div>}
      </div>}

      {tab==="winners"&&<div style={{display:"flex",flexDirection:"column",gap:16}}>
        {((localEvent.winners.length>0||winnerPicks.length>0)&&announced)?(
          <><div style={{padding:"24px",background:"linear-gradient(135deg,#FFF8E1,#FFFDE7)",borderRadius:18,border:`2px solid ${COLORS.gold}`,textAlign:"center"}}><div style={{fontSize:48,marginBottom:8}}>🎊</div><div style={{fontSize:22,fontWeight:800,color:"#7D5A00",marginBottom:6}}>Winners Announced!</div><div style={{fontSize:14,color:"#8D6E00"}}>{localEvent.title} · {localEvent.theme}</div></div>
          {(localEvent.winners.length>0?localEvent.winners:winnerPicks).map((wid,index)=>{
            const idea=ideas.find(i=>i.id===wid);if(!idea)return null;
            const medals=["🥇","🥈","🥉"];
            return <div key={wid} style={{background:"linear-gradient(135deg,#FFF8E1,#FFFDE7)",border:`2px solid ${COLORS.gold}`,borderRadius:16,padding:"20px 24px",display:"flex",alignItems:"center",gap:16}}>
              <div style={{fontSize:44}}>{medals[index]||"🏅"}</div><Av letter={idea.avatar} color={idea.avatarColor} size={52}/>
              <div style={{flex:1}}><div style={{fontSize:16,fontWeight:800,color:COLORS.navy,marginBottom:4}}>{idea.title}</div><div style={{fontSize:13,color:"#445566",marginBottom:6}}>{idea.shortDesc}</div><div style={{display:"flex",gap:8,flexWrap:"wrap"}}><Pill color={catColors[idea.category].text} bg={catColors[idea.category].bg}>{idea.category}</Pill><Pill color={COLORS.muted} bg={COLORS.lightBg}>{idea.author}</Pill></div></div>
              <div style={{textAlign:"right"}}><div style={{fontSize:28,fontWeight:800,color:COLORS.gold}}>{localEvent.eventVotes[idea.id]||0}</div><div style={{fontSize:11,color:COLORS.muted}}>event votes</div></div>
            </div>;
          })}
          <div style={{padding:"16px 20px",background:COLORS.lightBg,borderRadius:14,border:`1px solid ${COLORS.border}`}}><div style={{fontSize:13,fontWeight:700,color:COLORS.navy,marginBottom:6}}>🎁 Prize</div><div style={{fontSize:14,color:"#445566"}}>{localEvent.prize}</div></div></>
        ):<div style={{color:COLORS.muted,textAlign:"center",padding:"40px 0",fontSize:14}}>Winners haven't been announced yet. Go to Leaderboard to select and announce winners.</div>}
      </div>}

      {tab==="ai"&&<div style={{display:"flex",flexDirection:"column",gap:16}}>

      {[{label:"Event Title *",key:"title",placeholder:"e.g. Q3 Innovation Sprint"},{label:"Theme *",key:"theme",placeholder:"e.g. AI & Automation"}].map(({label,key,placeholder})=><div key={key}><div style={{fontSize:12,fontWeight:700,color:COLORS.navy,marginBottom:6}}>{label}</div><input value={form[key]} onChange={e=>set(key,e.target.value)} placeholder={placeholder} style={{width:"100%",padding:"10px 14px",borderRadius:10,border:`1px solid ${COLORS.border}`,fontSize:13,boxSizing:"border-box",fontFamily:"inherit"}}/></div>)}

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>{[{label:"Start Date *",key:"startDate"},{label:"End Date *",key:"endDate"},{label:"Voting Deadline",key:"votingDeadline"}].map(({label,key})=><div key={key}><div style={{fontSize:12,fontWeight:700,color:COLORS.navy,marginBottom:6}}>{label}</div><input type="date" value={form[key]} onChange={e=>set(key,e.target.value)} style={{width:"100%",padding:"10px 12px",borderRadius:10,border:`1px solid ${COLORS.border}`,fontSize:13,boxSizing:"border-box",fontFamily:"inherit"}}/></div>)}</div>
      <div><div style={{fontSize:12,fontWeight:700,color:COLORS.navy,marginBottom:6}}>Prize / Recognition *</div><input value={form.prize} onChange={e=>set("prize",e.target.value)} placeholder="e.g. $5,000 implementation budget" style={{width:"100%",padding:"10px 14px",borderRadius:10,border:`1px solid ${COLORS.border}`,fontSize:13,boxSizing:"border-box",fontFamily:"inherit"}}/></div>

function App(){
  const [ideas,setIdeas]=useState(INITIAL_IDEAS),[events,setEvents]=useState(SAMPLE_EVENTS),[user,setUser]=useState(DEFAULT_USER);
  const [page,setPage]=useState("feed"),[selected,setSelected]=useState(null),[showSubmit,setShowSubmit]=useState(false),[showProfile,setShowProfile]=useState(false);
  const [userVotes,setUserVotes]=useState({}), [search,setSearch]=useState(""),[filterCat,setFilterCat]=useState("All"),[filterStatus,setFilterStatus]=useState("All"),[sort,setSort]=useState("top");
  const [profileDropdown,setProfileDropdown]=useState(false);

  useEffect(()=>{const h=e=>{if(dropRef.current&&!dropRef.current.contains(e.target))setProfileDropdown(false)};document.addEventListener("mousedown",h);return()=>document.removeEventListener("mousedown",h)},[]);
  useEffect(()=>{if(selected)setSelected(ideas.find(i=>i.id===selected.id)||null)},[ideas]);// eslint-disable-line

  const handleVote=(id,type)=>setIdeas(prev=>prev.map(idea=>{if(idea.id!==id)return idea;const pv=userVotes[id];let{likes,dislikes}=idea;if(pv===type){if(type==="like")likes--;else dislikes--;setUserVotes(v=>({...v,[id]:null}))}else{if(pv==="like")likes--;if(pv==="dislike")dislikes--;if(type==="like")likes++;else dislikes++;setUserVotes(v=>({...v,[id]:type}))}return{...idea,likes,dislikes}}));

  const handleAddSolution=(id,text)=>{const s={id:Date.now(),user:user.name,text,votes:0};setIdeas(prev=>prev.map(i=>i.id===id?{...i,solutions:[...i.solutions,s]}:i));setSelected(prev=>prev?.id===id?{...prev,solutions:[...prev.solutions,s]}:prev)};
  const handleSubmitIdea=(form)=>setIdeas(prev=>[{id:Date.now(),title:form.title,category:form.category,shortDesc:form.shortDesc,detailDesc:form.detailDesc,example:form.example||"No example provided.",author:user.name,avatar:user.avatar,avatarColor:user.avatarColor,likes:0,dislikes:0,comments:[],solutions:[],tags:form.tags?form.tags.split(",").map(t=>t.trim()).filter(Boolean):[],status:"Open",date:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})},...prev]);
  const handleEventVote=(eventId,ideaId)=>setEvents(prev=>prev.map(e=>e.id!==eventId?e:{...e,eventVotes:{...e.eventVotes,[ideaId]:(e.eventVotes[ideaId]||0)+1}}));
  const handleSubmitToEvent=(action,eventId,payload)=>setEvents(prev=>prev.map(e=>{if(e.id!==eventId)return e;if(action==="add")return{...e,submissions:[...e.submissions,payload],eventVotes:{...e.eventVotes,[payload]:0}};if(action==="register")return{...e,registrations:[...e.registrations,payload]};return e}));
  const handleAnnounceWinners=(eventId,winners)=>setEvents(prev=>prev.map(e=>e.id!==eventId?e:{...e,winners,announced:true,status:"completed"}));
  const handleCreateEvent=(form)=>setEvents(prev=>[{id:Date.now(),...form,status:"active",submissions:[],eventVotes:{},winners:[],announced:false,registrations:[user.name]},...prev]);

  const filtered=ideas.filter(i=>filterCat==="All"||i.category===filterCat).filter(i=>filterStatus==="All"||i.status===filterStatus).filter(i=>!search||i.title.toLowerCase().includes(search.toLowerCase())||i.shortDesc.toLowerCase().includes(search.toLowerCase())||i.tags.some(t=>t.toLowerCase().includes(search.toLowerCase()))).sort((a,b)=>sort==="top"?(b.likes-b.dislikes)-(a.likes-a.dislikes):sort==="newest"?b.id-a.id:b.comments.length-a.comments.length);

      <div style={{display:"flex",gap:12,marginBottom:20}}>{[{label:"Total Ideas",value:ideas.length,color:COLORS.accent},{label:"Open",value:ideas.filter(i=>i.status==="Open").length,color:COLORS.green},{label:"In Review",value:ideas.filter(i=>i.status==="In Review").length,color:COLORS.gold},{label:"Solved",value:ideas.filter(i=>i.status==="Solved").length,color:COLORS.purple}].map(({label,value,color})=><div key={label} style={{flex:1,background:"#fff",borderRadius:12,padding:"14px 16px",border:`1px solid ${COLORS.border}`}}><div style={{fontSize:22,fontWeight:800,color}}>{value}</div><div style={{fontSize:11,color:COLORS.muted,fontWeight:600,textTransform:"uppercase",letterSpacing:0.5}}>{label}</div></div>)}</div>
      {activeEvCount>0&&<div onClick={()=>setPage("events")} style={{padding:"14px 20px",background:"linear-gradient(135deg,#FFF8E1,#FFFDE7)",borderRadius:14,border:`1.5px solid ${COLORS.gold}`,marginBottom:20,cursor:"pointer",display:"flex",alignItems:"center",gap:14}} onMouseEnter={e=>e.currentTarget.style.boxShadow="0 4px 16px rgba(243,156,18,0.2)"} onMouseLeave={e=>e.currentTarget.style.boxShadow="none"}><span style={{fontSize:28}}>🏆</span><div style={{flex:1}}><div style={{fontSize:14,fontWeight:700,color:"#7D5A00"}}>{activeEvCount} Active Ideation Event{activeEvCount>1?"s":""} — Submit your ideas now!</div><div style={{fontSize:12,color:"#8D6E00",marginTop:2}}>Compete for prizes and implementation resources</div></div><span style={{fontSize:13,fontWeight:700,color:"#7D5A00"}}>View Events →</span></div>}
      {user.interests?.length>0&&<div style={{padding:"12px 18px",background:"#fff",borderRadius:12,border:`1px solid ${COLORS.border}`,marginBottom:20,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}><span style={{fontSize:12,fontWeight:700,color:COLORS.navy}}>🎯 Your interests:</span>{user.interests.map(i=><span key={i} style={{fontSize:11,padding:"3px 10px",borderRadius:14,background:"#EEF4FF",color:COLORS.accent,fontWeight:600}}>{i}</span>)}<button onClick={()=>setShowProfile(true)} style={{marginLeft:"auto",fontSize:11,color:COLORS.muted,background:"none",border:"none",cursor:"pointer",textDecoration:"underline"}}>Edit interests</button></div>}
      {filtered.length===0?<div style={{textAlign:"center",padding:"60px 0",color:COLORS.muted,fontSize:15}}>No ideas match your filters. 💡</div>:<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(320px,1fr))",gap:18}}>{filtered.map(idea=><IdeaCard key={idea.id} idea={idea} onClick={setSelected} userVotes={userVotes} onVote={handleVote}/>)}</div>}
    </div>}

    {selected&&<IdeaModal idea={selected} onClose={()=>setSelected(null)} userVotes={userVotes} onVote={handleVote} onAddComment={handleAddComment} onAddSolution={handleAddSolution} currentUser={user}/>}
    {showSubmit&&<SubmitModal onClose={()=>setShowSubmit(false)} onSubmit={handleSubmitIdea} currentUser={user}/>}
    {showProfile&&<ProfileModal user={user} ideas={ideas} userVotes={userVotes} events={events} onClose={()=>setShowProfile(false)} onSave={updated=>setUser(updated)}/>}
  </div>
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
